name: CampusGrid Engine — CI/CD Pipeline

# Triggers on every push to main.
# Staging deploys automatically. Production requires manual approval.
on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/preetchahal769/campusgrid-engine

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Push Staging Image + Deploy to Staging
  # ─────────────────────────────────────────────────────────────────
  deploy-staging:
    name: 📦 Build & 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate Image Tag
        id: tag
        run: echo "value=staging-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & Push Staging Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: staging-env
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH into staging server & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE_NAME }}:staging-${{ github.sha }}"

            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u preetchahal769 --password-stdin

            echo "🧹 Freeing disk space before pull..."
            docker system prune -a -f --volumes 2>/dev/null || true

            echo "📥 Pulling new image: ${IMAGE}"
            docker pull ${IMAGE}

            echo "🛑 Stopping old backend container..."
            docker stop campusgrid-backend-staging 2>/dev/null || true
            docker rm   campusgrid-backend-staging 2>/dev/null || true

            echo "🚀 Starting new backend container..."
            docker run -d \
              --name campusgrid-backend-staging \
              --restart unless-stopped \
              -p 127.0.0.1:4000:4000 \
              --env-file /opt/campusgrid/.env.staging \
              -e NODE_TLS_REJECT_UNAUTHORIZED=0 \
              ${IMAGE}

            echo "✅ Staging deployed: staging-${{ github.sha }}"
            docker ps --filter name=campusgrid-backend-staging

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Manual approval gate before production
  # ─────────────────────────────────────────────────────────────────
  approve-production:
    name: ✋ Approve Production Deploy
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: Approval granted — proceeding to production build
        run: echo "Production deployment approved for commit ${{ github.sha }}"

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Build & Push Production Image + Deploy to Production
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: 📦 Build & 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: approve-production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production-env
          push: true
          tags: ${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH into production server & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE_NAME }}:prod-${{ github.sha }}"

            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u preetchahal769 --password-stdin

            echo "📥 Pulling new image: ${IMAGE}"
            docker pull ${IMAGE}

            echo "🛑 Stopping old backend container..."
            docker stop campusgrid-backend 2>/dev/null || true
            docker rm   campusgrid-backend 2>/dev/null || true

            echo "🚀 Starting new backend container..."
            docker run -d \
              --name campusgrid-backend \
              --restart unless-stopped \
              -p 127.0.0.1:4000:4000 \
              --env-file /opt/campusgrid/.env.production \
              ${IMAGE}

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Production deployed: prod-${{ github.sha }}"
            docker ps --filter name=campusgrid-backend
